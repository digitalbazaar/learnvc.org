<svg width="720" height="200" viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three-step diagram: Manufacturer issues a provenance credential; Product carries it through the supply chain; Buyer or auditor verifies it instantly">
  <defs>
    <filter id="sc-shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#c9c0ab" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Panel 1: Manufacturer issues -->
  <rect x="10" y="20" width="196" height="156" rx="3" fill="#ece6d6" stroke="#c9c0ab" stroke-width="1" filter="url(#sc-shadow)"/>
  <!-- Factory icon: building + chimney -->
  <rect x="72" y="62" width="72" height="44" rx="0" fill="none" stroke="#1b1a17" stroke-width="1.5"/>
  <rect x="80" y="54" width="12" height="8" rx="0" fill="#1b1a17"/>
  <rect x="98" y="50" width="12" height="12" rx="0" fill="#1b1a17"/>
  <rect x="116" y="56" width="12" height="6" rx="0" fill="#1b1a17"/>
  <!-- windows -->
  <rect x="78" y="70" width="10" height="10" rx="1" fill="#f4f0e6" stroke="#c9c0ab" stroke-width="1"/>
  <rect x="94" y="70" width="10" height="10" rx="1" fill="#f4f0e6" stroke="#c9c0ab" stroke-width="1"/>
  <rect x="110" y="70" width="10" height="10" rx="1" fill="#f4f0e6" stroke="#c9c0ab" stroke-width="1"/>
  <!-- credential tag hanging off -->
  <rect x="126" y="82" width="24" height="18" rx="2" fill="#f4f0e6" stroke="#9a7b2e" stroke-width="1"/>
  <line x1="130" y1="87" x2="146" y2="87" stroke="#c9c0ab" stroke-width="1"/>
  <line x1="130" y1="92" x2="144" y2="92" stroke="#c9c0ab" stroke-width="1"/>
  <circle cx="138" cy="82" r="2" fill="#9a7b2e"/>
  <line x1="138" y1="80" x2="138" y2="76" stroke="#9a7b2e" stroke-width="1"/>
  <!-- Step number -->
  <circle cx="32" cy="40" r="13" fill="#c0341d"/>
  <text x="32" y="45" text-anchor="middle" font-size="12" fill="#f4f0e6" font-family="Georgia,serif" font-weight="bold">1</text>
  <!-- Label -->
  <text x="108" y="148" text-anchor="middle" font-size="11" fill="#1b1a17" font-family="Georgia,serif" font-weight="bold">Manufacturer</text>
  <text x="108" y="163" text-anchor="middle" font-size="10" fill="#514c43" font-family="Georgia,serif" font-style="italic">issues provenance credential</text>

  <!-- Arrow 1→2 -->
  <line x1="214" y1="98" x2="238" y2="98" stroke="#c9c0ab" stroke-width="1.5"/>
  <polygon points="235,93 245,98 235,103" fill="#c9c0ab"/>

  <!-- Panel 2: Product carries it -->
  <rect x="252" y="20" width="196" height="156" rx="3" fill="#ece6d6" stroke="#c9c0ab" stroke-width="1" filter="url(#sc-shadow)"/>
  <!-- Box/package -->
  <rect x="306" y="58" width="88" height="52" rx="2" fill="#f4f0e6" stroke="#1b1a17" stroke-width="1.5"/>
  <!-- box lid line -->
  <line x1="306" y1="72" x2="394" y2="72" stroke="#1b1a17" stroke-width="1"/>
  <!-- tape cross on lid -->
  <line x1="335" y1="58" x2="335" y2="72" stroke="#c9c0ab" stroke-width="1.5"/>
  <line x1="365" y1="58" x2="365" y2="72" stroke="#c9c0ab" stroke-width="1.5"/>
  <!-- credential QR on side -->
  <rect x="316" y="78" width="22" height="22" rx="1" fill="#ece6d6" stroke="#9a7b2e" stroke-width="1"/>
  <!-- mini QR pattern -->
  <rect x="318" y="80" width="5" height="5" fill="#1b1a17" opacity=".5"/>
  <rect x="325" y="80" width="5" height="5" fill="#1b1a17" opacity=".5"/>
  <rect x="318" y="87" width="5" height="5" fill="#1b1a17" opacity=".5"/>
  <rect x="325" y="87" width="2" height="2" fill="#1b1a17" opacity=".5"/>
  <rect x="320" y="82" width="2" height="2" fill="#f4f0e6"/>
  <!-- route dots underneath box -->
  <circle cx="310" cy="120" r="3" fill="#c9c0ab"/>
  <circle cx="322" cy="124" r="3" fill="#c9c0ab"/>
  <circle cx="350" cy="120" r="3" fill="#9a7b2e"/>
  <circle cx="378" cy="124" r="3" fill="#c9c0ab"/>
  <circle cx="390" cy="120" r="3" fill="#c9c0ab"/>
  <line x1="313" y1="120" x2="319" y2="124" stroke="#c9c0ab" stroke-width="1"/>
  <line x1="325" y1="124" x2="347" y2="120" stroke="#c9c0ab" stroke-width="1"/>
  <line x1="353" y1="120" x2="375" y2="124" stroke="#c9c0ab" stroke-width="1"/>
  <line x1="381" y1="124" x2="387" y2="120" stroke="#c9c0ab" stroke-width="1"/>
  <!-- Step number -->
  <circle cx="274" cy="40" r="13" fill="#1b1a17"/>
  <text x="274" y="45" text-anchor="middle" font-size="12" fill="#f4f0e6" font-family="Georgia,serif" font-weight="bold">2</text>
  <!-- Label -->
  <text x="350" y="148" text-anchor="middle" font-size="11" fill="#1b1a17" font-family="Georgia,serif" font-weight="bold">Product</text>
  <text x="350" y="163" text-anchor="middle" font-size="10" fill="#514c43" font-family="Georgia,serif" font-style="italic">carries it through the chain</text>

  <!-- Arrow 2→3 -->
  <line x1="456" y1="98" x2="480" y2="98" stroke="#c9c0ab" stroke-width="1.5"/>
  <polygon points="477,93 487,98 477,103" fill="#c9c0ab"/>

  <!-- Panel 3: Buyer / auditor verifies -->
  <rect x="494" y="20" width="216" height="156" rx="3" fill="#ece6d6" stroke="#2f6b4f" stroke-width="1.5" filter="url(#sc-shadow)"/>
  <!-- Phone scanning a tag -->
  <rect x="548" y="48" width="34" height="56" rx="5" fill="#1b1a17"/>
  <rect x="552" y="54" width="26" height="40" rx="2" fill="#f4f0e6"/>
  <!-- scan lines on screen -->
  <line x1="554" y1="62" x2="576" y2="62" stroke="#2f6b4f" stroke-width="1.5"/>
  <line x1="554" y1="68" x2="576" y2="68" stroke="#2f6b4f" stroke-width=".75" opacity=".5"/>
  <line x1="554" y1="74" x2="576" y2="74" stroke="#2f6b4f" stroke-width=".75" opacity=".3"/>
  <!-- verify text on screen -->
  <text x="565" y="88" text-anchor="middle" font-size="10" fill="#2f6b4f" font-family="Georgia,serif">✓</text>
  <!-- Result badge -->
  <rect x="596" y="62" width="82" height="36" rx="3" fill="#f4f0e6" stroke="#2f6b4f" stroke-width="1.5"/>
  <text x="637" y="76" text-anchor="middle" font-size="9" fill="#2f6b4f" font-family="Georgia,serif" font-weight="bold" letter-spacing=".04em">ORIGIN VERIFIED</text>
  <text x="637" y="89" text-anchor="middle" font-size="8" fill="#514c43" font-family="Georgia,serif" font-style="italic">tamper-evident</text>
  <!-- connector line phone→badge -->
  <line x1="582" y1="80" x2="596" y2="80" stroke="#2f6b4f" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Step number -->
  <circle cx="516" cy="40" r="13" fill="#2f6b4f"/>
  <text x="516" y="45" text-anchor="middle" font-size="12" fill="#f4f0e6" font-family="Georgia,serif" font-weight="bold">3</text>
  <!-- Label -->
  <text x="602" y="148" text-anchor="middle" font-size="11" fill="#1b1a17" font-family="Georgia,serif" font-weight="bold">Buyer or auditor</text>
  <text x="602" y="163" text-anchor="middle" font-size="10" fill="#514c43" font-family="Georgia,serif" font-style="italic">verifies origin instantly</text>

  <!-- Bottom caption -->
  <line x1="10" y1="185" x2="710" y2="185" stroke="#c9c0ab" stroke-width=".5"/>
  <text x="360" y="197" text-anchor="middle" font-size="8.5" fill="#514c43" font-family="Georgia,serif" font-style="italic" letter-spacing=".02em">No central database · proof travels with the product · DSCSA / FSMA / UFLPA ready</text>
</svg>
