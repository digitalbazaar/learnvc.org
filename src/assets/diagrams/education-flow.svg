<svg width="720" height="200" viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three-step diagram: University issues a diploma credential; Graduate holds it in their wallet; Admissions office verifies it instantly">
  <defs>
    <filter id="edu-shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#c9c0ab" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Panel 1: University issues -->
  <rect x="10" y="20" width="196" height="156" rx="3" fill="#ece6d6" stroke="#c9c0ab" stroke-width="1" filter="url(#edu-shadow)"/>
  <!-- Mortarboard -->
  <rect x="83" y="44" width="50" height="7" rx="1.5" fill="#1b1a17"/>
  <polygon points="108,36 83,51 133,51" fill="#1b1a17"/>
  <line x1="133" y1="51" x2="137" y2="64" stroke="#1b1a17" stroke-width="2"/>
  <circle cx="137" cy="67" r="4" fill="#c0341d"/>
  <!-- Credential card -->
  <rect x="68" y="74" width="72" height="54" rx="3" fill="#f4f0e6" stroke="#9a7b2e" stroke-width="1.5"/>
  <rect x="74" y="80" width="16" height="16" rx="1" fill="#c0341d" opacity=".12"/>
  <text x="82" y="92" text-anchor="middle" font-size="7" fill="#c0341d" font-family="Georgia,serif" font-style="italic">SEAL</text>
  <line x1="96" y1="82" x2="132" y2="82" stroke="#c9c0ab" stroke-width="1.5"/>
  <line x1="96" y1="89" x2="130" y2="89" stroke="#c9c0ab" stroke-width="1"/>
  <line x1="96" y1="96" x2="132" y2="96" stroke="#c9c0ab" stroke-width="1"/>
  <line x1="96" y1="103" x2="126" y2="103" stroke="#c9c0ab" stroke-width="1"/>
  <circle cx="128" cy="116" r="7" fill="none" stroke="#9a7b2e" stroke-width="1.5"/>
  <text x="128" y="120" text-anchor="middle" font-size="8" fill="#9a7b2e" font-family="Georgia,serif">✓</text>
  <!-- Step number -->
  <circle cx="32" cy="40" r="13" fill="#c0341d"/>
  <text x="32" y="45" text-anchor="middle" font-size="12" fill="#f4f0e6" font-family="Georgia,serif" font-weight="bold">1</text>
  <!-- Label -->
  <text x="108" y="148" text-anchor="middle" font-size="11" fill="#1b1a17" font-family="Georgia,serif" font-weight="bold">University</text>
  <text x="108" y="163" text-anchor="middle" font-size="10" fill="#514c43" font-family="Georgia,serif" font-style="italic">issues a diploma</text>

  <!-- Arrow 1→2 -->
  <line x1="214" y1="98" x2="238" y2="98" stroke="#c9c0ab" stroke-width="1.5"/>
  <polygon points="235,93 245,98 235,103" fill="#c9c0ab"/>

  <!-- Panel 2: Graduate holds it -->
  <rect x="252" y="20" width="196" height="156" rx="3" fill="#ece6d6" stroke="#c9c0ab" stroke-width="1" filter="url(#edu-shadow)"/>
  <!-- Phone -->
  <rect x="320" y="42" width="42" height="70" rx="6" fill="#1b1a17"/>
  <rect x="325" y="48" width="32" height="54" rx="2" fill="#f4f0e6"/>
  <!-- Diploma inside screen -->
  <rect x="327" y="50" width="28" height="20" rx="1" fill="#ece6d6" stroke="#9a7b2e" stroke-width=".75"/>
  <line x1="330" y1="56" x2="352" y2="56" stroke="#c9c0ab" stroke-width="1"/>
  <line x1="330" y1="61" x2="350" y2="61" stroke="#c9c0ab" stroke-width="1"/>
  <line x1="330" y1="66" x2="352" y2="66" stroke="#c9c0ab" stroke-width="1"/>
  <!-- Lock icon (control) -->
  <rect x="334" y="81" width="14" height="10" rx="2" fill="#9a7b2e"/>
  <path d="M336,81 v-4 a5,5 0 0,1 10,0 v4" fill="none" stroke="#9a7b2e" stroke-width="1.5"/>
  <circle cx="341" cy="87" r="2" fill="#f4f0e6"/>
  <!-- Home bar -->
  <rect x="334" y="104" width="14" height="2" rx="1" fill="#c9c0ab"/>
  <!-- Step number -->
  <circle cx="274" cy="40" r="13" fill="#1b1a17"/>
  <text x="274" y="45" text-anchor="middle" font-size="12" fill="#f4f0e6" font-family="Georgia,serif" font-weight="bold">2</text>
  <!-- Label -->
  <text x="350" y="148" text-anchor="middle" font-size="11" fill="#1b1a17" font-family="Georgia,serif" font-weight="bold">Graduate</text>
  <text x="350" y="163" text-anchor="middle" font-size="10" fill="#514c43" font-family="Georgia,serif" font-style="italic">holds it in any wallet</text>

  <!-- Arrow 2→3 -->
  <line x1="456" y1="98" x2="480" y2="98" stroke="#c9c0ab" stroke-width="1.5"/>
  <polygon points="477,93 487,98 477,103" fill="#c9c0ab"/>

  <!-- Panel 3: Admissions verifies -->
  <rect x="494" y="20" width="216" height="156" rx="3" fill="#ece6d6" stroke="#2f6b4f" stroke-width="1.5" filter="url(#edu-shadow)"/>
  <!-- Verify ring + check -->
  <circle cx="602" cy="85" r="32" fill="none" stroke="#2f6b4f" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="602" cy="85" r="22" fill="#f4f0e6" stroke="#2f6b4f" stroke-width="1"/>
  <text x="602" y="93" text-anchor="middle" font-size="24" fill="#2f6b4f" font-family="Georgia,serif">✓</text>
  <!-- "instant" label -->
  <text x="602" y="130" text-anchor="middle" font-size="8" fill="#2f6b4f" font-family="Georgia,serif" letter-spacing=".06em">VERIFIED</text>
  <!-- Step number -->
  <circle cx="516" cy="40" r="13" fill="#2f6b4f"/>
  <text x="516" y="45" text-anchor="middle" font-size="12" fill="#f4f0e6" font-family="Georgia,serif" font-weight="bold">3</text>
  <!-- Label -->
  <text x="602" y="148" text-anchor="middle" font-size="11" fill="#1b1a17" font-family="Georgia,serif" font-weight="bold">Admissions office</text>
  <text x="602" y="163" text-anchor="middle" font-size="10" fill="#514c43" font-family="Georgia,serif" font-style="italic">verifies in seconds</text>

  <!-- Bottom caption -->
  <line x1="10" y1="185" x2="710" y2="185" stroke="#c9c0ab" stroke-width=".5"/>
  <text x="360" y="197" text-anchor="middle" font-size="8.5" fill="#514c43" font-family="Georgia,serif" font-style="italic" letter-spacing=".02em">No phone calls to the registrar · works across borders · any wallet</text>
</svg>
